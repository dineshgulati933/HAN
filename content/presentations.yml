# ---------------------------------------------------------------------------
# Talks and posters, grouped by meeting. Newest first is easiest to read, but
# order doesn't matter — the site sorts by date.
#
# MEETING fields
#   name:      full meeting name                                  (required)
#   short:     short label, used for the anchor link, e.g. "ASABE AIM 2026"
#   date:      first day, YYYY-MM-DD                               (required)
#   end:       last day, if it's a multi-day meeting
#   location:  City, ST                                            (required)
#   venue:     building / hotel (optional)
#   url:       meeting website (optional)
#
# TALK fields (one entry per talk or poster under "talks:")
#   title:     (required)
#   type:      oral | poster | invited | seminar | workshop | panel  (required)
#   date:      defaults to the meeting's first day
#   presenter: leave out if you presented. Otherwise write the name, e.g.
#              "Dr. Meetpal S. Kukal" -> shows "Presented by ..." and a co-author tag
#   authors:   optional author list, e.g. "Gulati, D., & Kukal, M. S."
#   poster:    poster file inside static/, e.g. posters/asabe26.png (png/jpg/pdf)
#              -> adds a thumbnail, a "View poster" button, and its own page
#   slug:      the poster page's address: /conf/<slug>. Set it BEFORE you print a
#              QR code and never change it afterwards.
#   slides:    link or file inside static/ (optional)
#   abstract:  short paragraph, shown on the poster page (optional)
#   links:     extra buttons, e.g. - { label: Try FAO56-Studio, url: https://... }
# ---------------------------------------------------------------------------

