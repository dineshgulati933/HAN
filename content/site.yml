interests:
  - title: Soil water budgeting
    icon: fa-solid fa-droplet
    text: >-
      FAO-56 dual crop coefficient models and contributions to the open-source
      pyfao56 package, recipient of the Irrigation Association's 2025 Vanguard Award.
  - title: Remote sensing and consumptive use
    icon: fa-solid fa-satellite
    text: >-
      Google Earth Engine workflows with OpenET, gridMET, and soils data to quantify
      consumptive water use from field to water-entity scales across the Eastern Snake Plain.
  - title: Climate-smart agriculture
    icon: fa-solid fa-seedling
    text: >-
      How soil organic carbon gains and conservation practices change agrohydrological
      outcomes across soils, climates, and irrigation management.
  - title: Scientific software
    icon: fa-solid fa-code
    text: >-
      Interactive web tools for agricultural water management, including FAO56-Studio
      and the SnakeFlux eddy covariance cooperator portal.

