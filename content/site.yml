bio: >-
  I am a Ph.D. candidate in Water Resources at the University of Idaho, working with
  Dr. Meetpal S. Kukal in the Agrohydrology for Global Change Lab. My dissertation develops
  and deploys soil water budget models tailored to Idaho agroecosystems, from field-scale
  FAO-56 simulations and eddy covariance measurements to OpenET-based consumptive use across
  the Eastern Snake Plain Aquifer. I also build no-code tools such as
  [FAO56-Studio](https://swb.hydroagrinexus.com/) so growers, water managers, and students
  can run these models themselves.

