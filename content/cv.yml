experience:
  - title: Graduate Research Assistant
    org: Department of Soil and Water Systems, University of Idaho
    dates: Aug 2024 – present
    bullets:
      - Developed a Google Earth Engine routine to obtain and analyze OpenET, gridMET, and soils data for the Eastern Snake Plain Aquifer.
      - Contributed to the pyfao56 open-source evapotranspiration and water balance tool (Irrigation Association Vanguard Award).
      - Contributed to developing a Python model for quantifying evapotranspiration of applied water.
      - Assessed soil organic carbon gain impacts on agrohydrological processes across soils, climates, and irrigation practices.
      - Built [SnakeFlux](https://fieldsync.pythonanywhere.com/), a Flask-based cooperator portal that automates eddy covariance data delivery and visualization.
      - Built [FAO56-Studio](https://swb.hydroagrinexus.com/), an interactive no-code platform to simulate FAO-56 based soil water budgets.
      - Analyzed eddy covariance energy balance closure and flux footprints using the flux-data-qaqc and fluxfootprints packages.
  - title: Summer Research Assistant, IWRRI
    org: University of Idaho
    dates: Jun – Aug 2025
    bullets:
      - Conducted an initial hydrological assessment of the Portneuf Watershed for IWRRI.
      - Analyzed gridMET, PRISM, OpenET, USDA CDL, NLCD, and IrrMapper datasets in Google Earth Engine using the JavaScript and Python APIs.
  - title: Graduate Research Assistant
    org: Department of Agricultural and Biological Engineering, The Pennsylvania State University
    dates: Aug 2023 – Aug 2024
    bullets:
      - Contributed to the pyfao56 open-source evapotranspiration and water balance tool.
      - Developed a machine learning model that enables the use of NOAA reference ET forecasts in the Western U.S.
      - Assessed soil organic carbon gain impacts on agrohydrological processes across soils, climates, and irrigation practices.
  - title: Senior Research Fellow
    org: Department of Soil Science, Punjab Agricultural University
    dates: May 2021 – May 2022
    bullets:
      - Planned and managed field experiments under microirrigation systems.
      - Developed low-cost, microcontroller-based sensors to observe climate and agricultural parameters for under $50.
      - Supported Ph.D. and master's students with research and taught practical classes for bachelor's students.
  - title: Master's Research
    org: Department of Soil and Water Engineering, Punjab Agricultural University
    dates: Aug 2018 – Apr 2021
    bullets:
      - Conducted field experiments for direct-seeded and transplanted rice.
      - Collected and analyzed soil moisture data using Delta PR2 probes.
      - Estimated and compared groundwater recharge using HYDRUS-1D simulations.

